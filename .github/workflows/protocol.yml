name: org-protocol

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/protocol.yml

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for flags in 914 946 147; do
            echo "=== flags $flags"
            curl -sS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
              -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=3.0-preview.1' \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"kristijanhusak.org-lsp\"},{\"filterType\":8,\"value\":\"Microsoft.VisualStudio.Code\"}]}],\"flags\":$flags}" \
              | jq '.results[0].extensions[0] | {flags, lastUpdated, publishedDate, versions: [.versions[]? | {version, targetPlatform, flags, lastUpdated, props: [.properties[]? | select(.key|test("Engine|PreRelease|Executes"))]}]}'
          done
          curl -sS -o /dev/null -w 'items page %{http_code}\n' 'https://marketplace.visualstudio.com/items?itemName=kristijanhusak.org-lsp'
