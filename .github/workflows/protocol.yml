name: org-protocol
on:
  push:
    paths:
      - .github/workflows/protocol.yml
permissions:
  contents: read
jobs:
  openvsx:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://open-vsx.org/api/kristijanhusak | head -c 400; echo
          curl -sS https://open-vsx.org/api/kristijanhusak/org-lsp | jq -c '{namespace, name, version, verified, preview, targetPlatform, allTargetPlatformVersions, error}'
