name: org-protocol

on:
  push:
    paths:
      - .github/workflows/protocol.yml

permissions:
  contents: read

jobs:
  openvsx:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in kristijanhusak kristijanhusak/org-lsp kristijanhusak/org-lsp/linux-x64/0.1.0 '-/search?query=org-lsp' '-/search?query=org&size=5'; do
            echo "=== $u"; curl -sS -w '\nHTTP %{http_code}\n' "https://open-vsx.org/api/$u" | jq -c 'if type=="object" then del(.files, .allVersions, .readme, .description, .dependencies, .bundledExtensions) else . end' 2>/dev/null || true
          done
          echo "=== raw"; curl -sS "https://open-vsx.org/api/kristijanhusak/org-lsp" | head -c 3000
