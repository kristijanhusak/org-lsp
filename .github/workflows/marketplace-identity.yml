# Run by hand (Actions > Marketplace identity > Run workflow): signs in as
# the Microsoft Entra ID app of the `marketplace` environment, as the
# release does, and says the ID the VS Code Marketplace knows it by, which
# goes in the members of the `kristijanhusak` publisher
# (https://marketplace.visualstudio.com/manage/publishers/kristijanhusak),
# then whether the app may publish there yet (docs/development.org,
# VS Code Marketplace).
name: Marketplace identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: The app's ID in Azure DevOps, which the Marketplace asks for
        run: |
          # 499b84ac-…: Azure DevOps, which the Marketplace is part of.
          az rest --method get --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --url 'https://app.vssps.visualstudio.com/_apis/connectionData' \
            --query '{id: authenticatedUser.id, name: authenticatedUser.providerDisplayName}' --output table
      - name: Whether it may publish as kristijanhusak
        working-directory: editors/vscode
        run: |
          npm ci
          npx --no-install vsce verify-pat --azure-credential kristijanhusak
