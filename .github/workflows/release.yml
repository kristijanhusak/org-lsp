# Builds the server for each platform, a VS Code package per platform with
# the server inside, the Sublime Text package and the Zed extension, and
# puts them on a GitHub release with scripts/install.sh, which installs
# them, and their checksums (SHA256SUMS):
#
# - each push to main (a merged pull request), or running it by hand on
#   main (Actions > Release > Run workflow), updates the `nightly`
#   prerelease, whose files keep the same links:
#   .../releases/download/nightly/org-lsp-<platform>.tar.gz
#   It has what built: the files of a platform whose build failed are
#   taken off, not left from an older build.
# - a version tag (`v0.2.0`, the version scripts/version.sh set) makes
#   that release, only when every build succeeded, and then publishes it.
# - a push to main whose version has no tag yet (the pull request the New
#   version workflow opens, merged) is that version's release: the tag
#   `v0.2.0` is made on the commit when every build succeeded.
#   Run by hand with that tag (Actions > Release > Run workflow, `tag`),
#   it builds the tag again, puts the files on its release (made already
#   on GitHub's page for the tag, or not), and publishes it: the workflow
#   is then this one, of main, where a run of the tag's own again would be
#   the tag's
#   (docs/development.org, Publishing): the VS Code packages on the VS Code
#   Marketplace (as the Microsoft Entra ID app of the `marketplace`
#   environment, or with the secret VSCE_PAT) and Open VSX (OVSX_PAT).
#   Each is skipped while its secret is not set.
#
# The Zed extension and the Sublime Text package download the server of
# their own release (`v0.2.0`); those of the nightly build download the
# nightly server.
#
# Pull requests do not run it.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: A version tag to release again (v0.2.0); empty for the nightly build
        required: false
        default: ''

# Only the job that publishes writes.
permissions:
  contents: read

# One publish at a time; a newer push to main replaces an older one,
# except the commit of a new version (/Version 0.2.0/), which is released
# whatever comes after it.
concurrency:
  group: release-${{ inputs.tag || (startsWith(github.event.head_commit.message, 'Version ') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && !inputs.tag }}

jobs:
  # The version tag released (`tag`): pushed, asked for, or that of main's
  # version when it has none yet; empty for the nightly build.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - id: tag
        env:
          ASKED: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          tag=$ASKED
          if [ -z "$tag" ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            version=v$(scripts/version.sh)
            # 2: no such tag; anything else but 0 is an error.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null || status=$?
            case $status in
              0) ;;
              2) tag=$version; echo "main has $version, which has no tag yet: it is released" ;;
              *) echo "::error::The tags could not be read"; exit 1 ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they run on any distribution.
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-musl
            vscode: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            target: aarch64-unknown-linux-musl
            vscode: linux-arm64
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            vscode: darwin-arm64
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            vscode: darwin-x64
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            vscode: win32-x64
    runs-on: ${{ matrix.os }}
    # The nightly build compiles on every core of the runner (Windows' is
    # the slowest), as the release profile's single codegen unit and LTO
    # compile the server's crate on one; a version tag is built as
    # Cargo.toml says.
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.version.outputs.tag && '1' || '16' }}
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.version.outputs.tag && 'thin' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      # The dependencies built before, for this target and this profile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ needs.version.outputs.tag && 'tag' || 'nightly' }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-${{ needs.version.outputs.tag && 'tag' || 'nightly' }}-
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The commit a released server says it was built from (the one
      # checked out: a tag's, also when run by hand on main); without it
      # the server says it is a build of its own (`-dev`).
      - name: Build the server
        shell: bash
        run: ORG_LSP_COMMIT=$(git rev-parse HEAD) cargo build --release --locked -p org-lsp --target ${{ matrix.target }}

      - name: Archive the server
        shell: bash
        run: |
          exe=org-lsp; [[ "${{ matrix.target }}" == *windows* ]] && exe=org-lsp.exe
          dir="target/${{ matrix.target }}/release"
          if [[ "$exe" == *.exe ]]; then
            (cd "$dir" && 7z a "$GITHUB_WORKSPACE/org-lsp-${{ matrix.name }}.zip" "$exe")
          else
            tar -czf "org-lsp-${{ matrix.name }}.tar.gz" -C "$dir" "$exe"
          fi
          echo "EXE=$dir/$exe" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Package the VS Code extension
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm run bundle-server -- "../../$EXE"
          npx vsce package --no-dependencies --baseContentUrl https://github.com/kristijanhusak/org-lsp/blob/HEAD/editors/vscode --baseImagesUrl https://github.com/kristijanhusak/org-lsp/raw/HEAD/editors/vscode --target "${{ matrix.vscode }}" --out "../../org-lsp-${{ matrix.vscode }}.vsix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: org-lsp-${{ matrix.name }}
          path: |
            org-lsp-${{ matrix.name }}.*
            org-lsp-${{ matrix.vscode }}.vsix
          if-no-files-found: error

  zed:
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      # The `zed-extension` tool zed-industries/extensions packages the
      # extensions of Zed's registry with (its ZED_EXTENSION_CLI_SHA): it
      # builds the extension and its grammar, and packs them as Zed
      # installs them. Its checksum is checked before it runs.
      ZED_EXTENSION_CLI_SHA: 9ee3c503a4bbbc6b4a0f8a789acca4871d773223
      ZED_EXTENSION_SHA256: a6fca5ef11ff23f0ef8b03bd2453270591c9fc6c03700c3c92017e5082ada757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: The tag is the version
        if: env.TAG != ''
        run: |
          version=$(scripts/version.sh)
          [ "$TAG" = "v$version" ] ||
            { echo "::error::The tag $TAG is not v$version, the version scripts/version.sh set"; exit 1; }
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip2
          rustup default stable
      - name: Package the Zed extension
        run: |
          # The release whose server it downloads: its own version's, or
          # the nightly one (ORG_LSP_RELEASE, read when it is built).
          if [ -n "$TAG" ]; then
            release=v$(scripts/version.sh)
          else
            release=nightly
            export ORG_LSP_RELEASE=nightly
          fi
          curl -fsSL -o "$RUNNER_TEMP/zed-extension" "https://zed-extension-cli.nyc3.digitaloceanspaces.com/$ZED_EXTENSION_CLI_SHA/x86_64-unknown-linux-gnu/zed-extension"
          echo "$ZED_EXTENSION_SHA256  $RUNNER_TEMP/zed-extension" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/zed-extension"
          "$RUNNER_TEMP/zed-extension" --source-dir editors/zed --scratch-dir "$RUNNER_TEMP/zed-scratch" --output-dir "$RUNNER_TEMP/zed-out"
          mv "$RUNNER_TEMP/zed-out/archive.tar.gz" org-lsp-zed.tar.gz
          tar -tzf org-lsp-zed.tar.gz
          for file in extension.toml extension.wasm grammars/org.wasm languages/org/config.toml; do
            tar -tzf org-lsp-zed.tar.gz | grep -qx "./$file" || { echo "org-lsp-zed.tar.gz has no $file"; exit 1; }
          done
          tar -xzOf org-lsp-zed.tar.gz ./extension.wasm | grep -aq "$release" ||
            { echo "The extension does not download the server of $release"; exit 1; }
          # Its tasks and keys, which scripts/install.sh adds to Zed's.
          cp editors/zed/tasks.json org-lsp-zed-tasks.json
          cp editors/zed/keymap.json org-lsp-zed-keymap.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: org-lsp-zed
          path: org-lsp-zed*
          if-no-files-found: error

  publish:
    needs: [version, build, zed]
    # A version: when every build succeeded. Nightly: the platforms that
    # built, also when one failed.
    if: ${{ !cancelled() && needs.version.result == 'success' && ((needs.version.outputs.tag && needs.build.result == 'success' && needs.zed.result == 'success') || (!needs.version.outputs.tag && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    # It pushes the version's tag or the `nightly` one, and makes the
    # release.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Package the Sublime Text package, Helix's queries and the install script
        run: |
          # The nightly package downloads the nightly server; a version's,
          # its own (`'v' + VERSION`).
          if [ -z "$TAG" ]; then
            sed -i "s/^RELEASE = 'v' + VERSION .*/RELEASE = 'nightly'/" editors/sublime/LSP-org/plugin.py
            grep -qx "RELEASE = 'nightly'" editors/sublime/LSP-org/plugin.py || { echo "plugin.py has no RELEASE to set"; exit 1; }
          fi
          (cd editors/sublime && zip -qr "$GITHUB_WORKSPACE/dist/org-lsp-sublime.zip" LSP-org -x '*__pycache__*')
          tar -czf dist/org-lsp-helix.tar.gz -C editors/helix/runtime queries
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [ -n "$TAG" ]; then
            # main's new version: its tag goes on this commit.
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
            fi
            # A release made on GitHub's page with the tag has no files:
            # they go to it, its title and notes as they are.
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag dist/*
            fi
            exit 0
          fi
          # nightly: the tag moves to this commit, the files are replaced,
          # and those not built this time (a platform whose build failed)
          # go, so that none is left that SHA256SUMS does not list.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). Neovim and Vim download the server themselves; install.sh installs it for VS Code, Sublime Text, Zed and Helix."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes"
          fi
          gh release view nightly --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            [ -e "dist/$asset" ] || gh release delete-asset nightly "$asset" --yes
          done
          gh release upload nightly dist/* --clobber

  # The jobs below publish a version's release once it is made. Each is
  # skipped while its secret is not set (a secret cannot be tested in a
  # job's `if`, so its steps test it in `env`). The VS Code tools are
  # those of editors/vscode's package-lock.json.
  vscode-marketplace:
    needs: [version, publish]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    # Its secrets: AZURE_CLIENT_ID and AZURE_TENANT_ID, the Microsoft Entra
    # ID app the job signs in as (a federated credential for this
    # environment, no secret of its own), a member of the `kristijanhusak`
    # publisher. Or VSCE_PAT, a token of an Azure DevOps organization of the
    # publisher with Marketplace > Manage, which Azure DevOps takes until
    # December 1, 2026.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      PUBLISH: ${{ secrets.AZURE_CLIENT_ID != '' || secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PUBLISH == 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISH == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the VS Code packages on the VS Code Marketplace
        if: env.PUBLISH == 'true'
        working-directory: editors/vscode
        run: |
          npm ci
          # As the app signed in above, or with the token.
          credential=()
          if [ -n "$AZURE_CLIENT_ID" ]; then
            credential=(--azure-credential)
          fi
          # A version already there (the job run again) is not an error.
          npx --no-install vsce publish "${credential[@]}" --skip-duplicate --packagePath "$GITHUB_WORKSPACE"/dist/*.vsix

  open-vsx:
    needs: [version, publish]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      # A token of the open-vsx.org account that owns the `kristijanhusak`
      # namespace.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.OVSX_PAT != ''
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.OVSX_PAT != ''
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.OVSX_PAT != ''
        with:
          path: dist
          merge-multiple: true
      - name: Publish the VS Code packages on Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: |
          npm ci
          npx --no-install ovsx publish --skip-duplicate --packagePath "$GITHUB_WORKSPACE"/dist/*.vsix
