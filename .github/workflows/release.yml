# Builds the server for each platform, and a VS Code package per platform
# with the server inside, and puts them on a GitHub release:
#
# - running it by hand on main (Actions > Release > Run workflow) updates
#   the `nightly` prerelease, whose files keep the same links:
#   .../releases/download/nightly/org-lsp-<platform>.tar.gz
# - a version tag (`v0.2.0`) makes that release.
#
# Pushes to main and pull requests do not run it, to save Actions minutes;
# put `branches: [main]` under `push` back to build each push to main.
# scripts/install-vscode.sh installs the VS Code package from a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push to main replaces an older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they run on any distribution.
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-musl
            vscode: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            target: aarch64-unknown-linux-musl
            vscode: linux-arm64
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            vscode: darwin-arm64
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            vscode: darwin-x64
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            vscode: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p org-lsp --target ${{ matrix.target }}

      - name: Archive the server
        shell: bash
        run: |
          exe=org-lsp; [[ "${{ matrix.target }}" == *windows* ]] && exe=org-lsp.exe
          dir="target/${{ matrix.target }}/release"
          if [[ "$exe" == *.exe ]]; then
            (cd "$dir" && 7z a "$GITHUB_WORKSPACE/org-lsp-${{ matrix.name }}.zip" "$exe")
          else
            tar -czf "org-lsp-${{ matrix.name }}.tar.gz" -C "$dir" "$exe"
          fi
          echo "EXE=$dir/$exe" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the VS Code extension
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm run bundle-server -- "../../$EXE"
          npx vsce package --no-dependencies --baseContentUrl https://github.com/kristijanhusak/org-lsp/blob/HEAD/editors/vscode --baseImagesUrl https://github.com/kristijanhusak/org-lsp/raw/HEAD/editors/vscode --target "${{ matrix.vscode }}" --out "../../org-lsp-${{ matrix.vscode }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: org-lsp-${{ matrix.name }}
          path: |
            org-lsp-${{ matrix.name }}.*
            org-lsp-${{ matrix.vscode }}.vsix
          if-no-files-found: error

  publish:
    needs: build
    # The platforms that built, also when one failed.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
            exit 0
          fi
          # nightly: the tag moves to this commit, the files are replaced.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). Install the VS Code extension with scripts/install-vscode.sh."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes"
          fi
          gh release upload nightly dist/* --clobber
