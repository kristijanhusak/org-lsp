# Builds the server for each platform, a VS Code package per platform with
# the server inside, the Sublime Text package and the Zed extension, and
# puts them on a GitHub release with scripts/install.sh, which installs
# them, and their checksums (SHA256SUMS):
#
# - running it by hand on main (Actions > Release > Run workflow) updates
#   the `nightly` prerelease, whose files keep the same links:
#   .../releases/download/nightly/org-lsp-<platform>.tar.gz
#   It has what built: the files of a platform whose build failed are
#   taken off, not left from an older build.
# - a version tag (`v0.2.0`, the version scripts/version.sh set) makes
#   that release, only when every build succeeded.
#
# The Zed extension and the Sublime Text package download the server of
# their own release (`v0.2.0`); those of the nightly build download the
# nightly server.
#
# Pushes to main and pull requests do not run it, to save Actions minutes;
# put `branches: [main]` under `push` back to build each push to main.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only the job that publishes writes.
permissions:
  contents: read

# One publish at a time; a newer push to main replaces an older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they run on any distribution.
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-musl
            vscode: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            target: aarch64-unknown-linux-musl
            vscode: linux-arm64
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            vscode: darwin-arm64
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            vscode: darwin-x64
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            vscode: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p org-lsp --target ${{ matrix.target }}

      - name: Archive the server
        shell: bash
        run: |
          exe=org-lsp; [[ "${{ matrix.target }}" == *windows* ]] && exe=org-lsp.exe
          dir="target/${{ matrix.target }}/release"
          if [[ "$exe" == *.exe ]]; then
            (cd "$dir" && 7z a "$GITHUB_WORKSPACE/org-lsp-${{ matrix.name }}.zip" "$exe")
          else
            tar -czf "org-lsp-${{ matrix.name }}.tar.gz" -C "$dir" "$exe"
          fi
          echo "EXE=$dir/$exe" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Package the VS Code extension
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm run bundle-server -- "../../$EXE"
          npx vsce package --no-dependencies --baseContentUrl https://github.com/kristijanhusak/org-lsp/blob/HEAD/editors/vscode --baseImagesUrl https://github.com/kristijanhusak/org-lsp/raw/HEAD/editors/vscode --target "${{ matrix.vscode }}" --out "../../org-lsp-${{ matrix.vscode }}.vsix"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org-lsp-${{ matrix.name }}
          path: |
            org-lsp-${{ matrix.name }}.*
            org-lsp-${{ matrix.vscode }}.vsix
          if-no-files-found: error

  zed:
    runs-on: ubuntu-latest
    env:
      # The `zed-extension` tool zed-industries/extensions packages the
      # extensions of Zed's registry with (its ZED_EXTENSION_CLI_SHA): it
      # builds the extension and its grammar, and packs them as Zed
      # installs them. Its checksum is checked before it runs.
      ZED_EXTENSION_CLI_SHA: 9ee3c503a4bbbc6b4a0f8a789acca4871d773223
      ZED_EXTENSION_SHA256: a6fca5ef11ff23f0ef8b03bd2453270591c9fc6c03700c3c92017e5082ada757
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(scripts/version.sh)
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "::error::The tag $GITHUB_REF_NAME is not v$version, the version scripts/version.sh set"; exit 1; }
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip2
          rustup default stable
      - name: Package the Zed extension
        run: |
          # The release whose server it downloads: its own version's, or
          # the nightly one (ORG_LSP_RELEASE, read when it is built).
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release=v$(scripts/version.sh)
          else
            release=nightly
            export ORG_LSP_RELEASE=nightly
          fi
          curl -fsSL -o "$RUNNER_TEMP/zed-extension" "https://zed-extension-cli.nyc3.digitaloceanspaces.com/$ZED_EXTENSION_CLI_SHA/x86_64-unknown-linux-gnu/zed-extension"
          echo "$ZED_EXTENSION_SHA256  $RUNNER_TEMP/zed-extension" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/zed-extension"
          "$RUNNER_TEMP/zed-extension" --source-dir editors/zed --scratch-dir "$RUNNER_TEMP/zed-scratch" --output-dir "$RUNNER_TEMP/zed-out"
          mv "$RUNNER_TEMP/zed-out/archive.tar.gz" org-lsp-zed.tar.gz
          tar -tzf org-lsp-zed.tar.gz
          for file in extension.toml extension.wasm grammars/org.wasm languages/org/config.toml; do
            tar -tzf org-lsp-zed.tar.gz | grep -qx "./$file" || { echo "org-lsp-zed.tar.gz has no $file"; exit 1; }
          done
          tar -xzOf org-lsp-zed.tar.gz ./extension.wasm | grep -aq "$release" ||
            { echo "The extension does not download the server of $release"; exit 1; }
          # Its tasks and keys, which scripts/install.sh adds to Zed's.
          cp editors/zed/tasks.json org-lsp-zed-tasks.json
          cp editors/zed/keymap.json org-lsp-zed-keymap.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org-lsp-zed
          path: org-lsp-zed*
          if-no-files-found: error

  publish:
    needs: [build, zed]
    # A version: when every build succeeded. Nightly: the platforms that
    # built, also when one failed.
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.build.result == 'success' && needs.zed.result == 'success') || (github.event_name != 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    # It pushes the `nightly` tag and makes the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Package the Sublime Text package, Helix's queries and the install script
        run: |
          # The nightly package downloads the nightly server; a version's,
          # its own (`'v' + VERSION`).
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            sed -i "s/^RELEASE = 'v' + VERSION .*/RELEASE = 'nightly'/" editors/sublime/LSP-org/plugin.py
            grep -qx "RELEASE = 'nightly'" editors/sublime/LSP-org/plugin.py || { echo "plugin.py has no RELEASE to set"; exit 1; }
          fi
          (cd editors/sublime && zip -qr "$GITHUB_WORKSPACE/dist/org-lsp-sublime.zip" LSP-org -x '*__pycache__*')
          tar -czf dist/org-lsp-helix.tar.gz -C editors/helix/runtime queries
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
            exit 0
          fi
          # nightly: the tag moves to this commit, the files are replaced,
          # and those not built this time (a platform whose build failed)
          # go, so that none is left that SHA256SUMS does not list.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). Neovim and Vim download the server themselves; install.sh installs it for VS Code, Sublime Text, Zed and Helix."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes"
          fi
          gh release view nightly --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            [ -e "dist/$asset" ] || gh release delete-asset nightly "$asset" --yes
          done
          gh release upload nightly dist/* --clobber

