# Makes a new version: sets it with scripts/version.sh in a pull request
# (/Version 0.1.14/), merges it, tags the merged commit on main
# (`v0.1.14`) and runs the Release workflow for the tag, which builds it,
# makes the GitHub release and publishes it (docs/development.org,
# Publishing).
#
# Run by hand on main (Actions > New version > Run workflow). The version
# is the last one with its last number one more (0.1.13 makes 0.1.14), or
# the one given (`version`, 0.2.0). When main has a version that has no
# tag yet (its pull request merged by hand), that version is released
# instead, with nothing to set.
#
# main takes changes only through pull requests, and GitHub starts no
# workflow for what the workflow's own token pushes: the Release workflow
# is started here instead, with the tag.
name: New version

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version (X.Y.Z); empty for the last one with its last number one more
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: new-version

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # It opens and merges the pull request, pushes the tag and starts the
    # Release workflow.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      WANTED: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: The version
        run: |
          current=$(scripts/version.sh)
          tagged() { git ls-remote --exit-code --tags origin "refs/tags/v$1" > /dev/null; }
          if { [ -z "$WANTED" ] || [ "$WANTED" = "$current" ]; } && ! tagged "$current"; then
            echo "main has $current, which has no tag yet: it is released as it is"
            echo "VERSION=$current" >> "$GITHUB_ENV"
            exit 0
          fi
          version=${WANTED:-${current%.*}.$(( ${current##*.} + 1 ))}
          if tagged "$version"; then
            echo "::error::The tag v$version is there already; delete it and its release on GitHub, or give another version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SET=1" >> "$GITHUB_ENV"
      - name: Install Rust
        if: env.SET
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # scripts/version.sh updates the lock files offline: the crates they
      # name have to be there.
      - name: Fetch the crates
        if: env.SET
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path editors/zed/Cargo.toml
      - name: Set the version in a pull request and merge it
        if: env.SET
        run: |
          scripts/version.sh "$VERSION"
          branch="version/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Version $VERSION"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Version $VERSION" \
            --body "Sets the version to $VERSION (scripts/version.sh), made by the New version workflow.")
          if ! gh pr merge "$url" --squash --delete-branch; then
            echo "::error::$url could not be merged; merge it, then run New version again to release $VERSION"
            exit 1
          fi
      - name: Tag main
        run: |
          git fetch origin main
          git checkout -q FETCH_HEAD
          have=$(scripts/version.sh)
          [ "$have" = "$VERSION" ] ||
            { echo "::error::main has $have, not $VERSION"; exit 1; }
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Release it
        run: gh workflow run release.yml --ref main -f "tag=v$VERSION"
