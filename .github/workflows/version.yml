# Opens the pull request of a new version: /Version 0.1.14/, which sets it
# with scripts/version.sh, with the one who ran the workflow asked to
# review it. Merged, it is released: the Release workflow, run for the
# push to main, finds main's version without a tag, builds it, tags the
# commit `v0.1.14`, makes the GitHub release and publishes it
# (docs/development.org, Publishing).
#
# Run by hand on main (Actions > New version > Run workflow). The version
# is the last one with its last number one more (0.1.13 makes 0.1.14), or
# the one given (`version`, 0.2.0).
name: New version

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version (X.Y.Z); empty for the last one with its last number one more
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: new-version

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # It pushes the pull request's branch and opens it.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      WANTED: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: The version
        run: |
          current=$(scripts/version.sh)
          tagged() { git ls-remote --exit-code --tags origin "refs/tags/v$1" > /dev/null; }
          if ! tagged "$current"; then
            echo "::error::main has $current, which has no tag yet: the Release workflow of its commit releases it (run it again if it failed)"
            exit 1
          fi
          version=${WANTED:-${current%.*}.$(( ${current##*.} + 1 ))}
          if tagged "$version"; then
            echo "::error::The tag v$version is there already; give another version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # scripts/version.sh updates the lock files offline: the crates they
      # name have to be there.
      - name: Fetch the crates
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path editors/zed/Cargo.toml
      - name: Open the pull request
        run: |
          scripts/version.sh "$VERSION"
          branch="version/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Version $VERSION"
          # The branch is this workflow's own: one left by an earlier run
          # is replaced.
          git push --force origin "$branch"
          if url=$(gh pr view "$branch" --json url,state --jq 'select(.state == "OPEN") | .url' 2> /dev/null) && [ -n "$url" ]; then
            echo "The pull request is open already: $url"
          else
            url=$(gh pr create --base main --head "$branch" --title "Version $VERSION" --reviewer "$GITHUB_ACTOR" \
              --body "Sets the version to $VERSION (scripts/version.sh). Merged, it is released: the Release workflow tags the merged commit v$VERSION, makes the GitHub release and publishes it.")
          fi
          echo "::notice::$url"
          echo "[Version $VERSION]($url)" >> "$GITHUB_STEP_SUMMARY"
