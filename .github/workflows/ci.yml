name: CI

# Paused to save Actions minutes: runs only when started by hand
# (Actions > CI > Run workflow). Put the push and pull_request triggers
# back to run it on every change again:
#
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
      # Show each finding on the line it is about.
      - name: Annotate clippy findings
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.log | sort -u | head -40 |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning)[^:]*: (.*)$/::error file=\1,line=\2,col=\3::\5/'
      # Export runs in Emacs: the test of it needs one (Org 9.6 or newer).
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox
      # The Org the tests are recorded from (CLAUDE.md), compiled: Emacs
      # 29's own is 9.6.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: org
        with:
          path: ~/org-mode
          key: org-9.8.10-${{ runner.os }}-emacs29
      - name: Org 9.8.10
        if: steps.org.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch release_9.8.10 https://github.com/bzg/org-mode "$HOME/org-mode"
          make -C "$HOME/org-mode" compile
      - run: echo "ORG_LISP_DIR=$HOME/org-mode/lisp" >> "$GITHUB_ENV"
      - run: cargo test --workspace
        env:
          ORG_LSP_REQUIRE_EMACS: '1'

  neovim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the current one.
        neovim: [v0.12.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Neovim
        run: |
          curl -sSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz
          mkdir -p "$HOME/nvim" && tar xzf nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"
      # The typed scenarios run Neovim's terminal UI in tmux; the test of
      # images makes its pictures with ImageMagick.
      - name: Install tmux and ImageMagick
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux imagemagick
      - run: scripts/test-nvim.sh

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build -p org-lsp
        working-directory: .
      - run: npm ci
      # package.json must match what the server announces.
      - run: npm run generate -- --check
      # So must the generated parts of the documentation.
      - run: node ../../scripts/generate-docs.mjs ../../target/debug/org-lsp --check
      - run: npm run check
      - run: npm run build
      - run: npm run smoke -- ../../target/debug/org-lsp
      # The scenarios press keys with xdotool; column view needs Emacs.
      - name: Install xdotool and Emacs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xdotool emacs-nox
      # The extension inside VS Code, then the end-to-end scenarios.
      - run: xvfb-run -a npm test

  vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # A selection is Emacs's region: the commands run on one need Emacs.
      - name: Install Vim, tmux and Emacs
        run: sudo apt-get update -q && sudo apt-get install -y -q vim tmux emacs-nox
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The LSP clients the plugin has adapters for.
      - name: Check out the clients
        run: |
          mkdir -p "$HOME/vim-clients" && cd "$HOME/vim-clients"
          git clone -q --depth 1 https://github.com/yegappan/lsp lsp
          git clone -q --depth 1 https://github.com/prabirshrestha/vim-lsp vim-lsp
          git clone -q --depth 1 --branch release https://github.com/neoclide/coc.nvim coc.nvim
          git clone -q --depth 1 https://github.com/dense-analysis/ale ale
      - run: cargo build -p org-lsp
      - run: vim --version | head -2
      - run: CLIENTS="$HOME/vim-clients" editors/vim/test/run.sh

  sublime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build -p org-lsp
      # The package's keys and settings must match what the server announces.
      - run: node editors/sublime/generate.mjs target/debug/org-lsp --check
      - run: python3 editors/sublime/test/test_plugin.py

  zed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2 && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build -p org-lsp
      # The semantic token rules must match what the server announces.
      - run: node editors/zed/generate.mjs target/debug/org-lsp --check
      - name: Build the extension
        run: cargo build --release --target wasm32-wasip2
        working-directory: editors/zed
      # The tree-sitter queries must compile against the grammar.
      - name: Check the queries
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tree-sitter.gz" https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.10/tree-sitter-linux-x64.gz
          echo "8283ddba69253c698f6e987ba0e2f9285e079c8db4d36ebe1394b5bb3a0ebdfd  $RUNNER_TEMP/tree-sitter.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          commit=$(sed -n 's/^commit = "\(.*\)"/\1/p' editors/zed/extension.toml)
          git clone -q https://github.com/milisims/tree-sitter-org "$RUNNER_TEMP/tree-sitter-org"
          git -C "$RUNNER_TEMP/tree-sitter-org" checkout -q "$commit"
          printf '* TODO Headline :tag:\n:PROPERTIES:\n:ID: 1\n:END:\n- item\n# comment\n' > "$RUNNER_TEMP/sample.org"
          cd "$RUNNER_TEMP/tree-sitter-org"
          for query in "$GITHUB_WORKSPACE"/editors/zed/languages/org/*.scm; do
            "$RUNNER_TEMP/tree-sitter" query "$query" "$RUNNER_TEMP/sample.org" > /dev/null
          done
