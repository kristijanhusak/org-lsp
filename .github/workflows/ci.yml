name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
      # Show each finding on the line it is about.
      - name: Annotate clippy findings
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.log | sort -u | head -40 |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning)[^:]*: (.*)$/::error file=\1,line=\2,col=\3::\5/'
      - run: cargo test --workspace

  neovim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Neovim
        run: |
          curl -sSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          mkdir -p "$HOME/nvim" && tar xzf nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"
      - run: scripts/test-nvim.sh

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p org-lsp
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
