name: Bug
description: Something org-lsp does wrong, or differently from Emacs Org
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. org-lsp follows Emacs Org mode: where it does something differently from Emacs, that is a bug too.
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - Neovim
        - Vim
        - VS Code
        - Sublime Text
        - Zed
        - Helix
        - Another editor
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor version, and its LSP client
      description: For Vim, which LSP client (yegappan/lsp, vim-lsp, coc.nvim, ALE); for another editor, its name.
      placeholder: NVIM v0.12.0
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: org-lsp version
      description: What "Show the version of the server" says (`:Org version` in Neovim and Vim), or `org-lsp --version`.
      placeholder: org-lsp 0.1.3-3f64b38
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: org
    attributes:
      label: Org text
      description: The smallest Org text that shows the problem. Mark where the cursor is with `|` if it matters.
      render: org
      placeholder: |
        * TODO Write the report|
          SCHEDULED: <2026-11-02 Mon>
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, key by key or command by command.
      placeholder: |
        1. Open the file above.
        2. Put the cursor on the headline.
        3. Press `C-c C-t`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The text after it, the message shown, or a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: What Emacs Org does for the same, if you know; the Emacs command or option helps (`org-todo`, `org-log-done`).
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The org-lsp options you set (`config.toml`, your editor's settings), if any.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Errors from the editor's LSP log, if any (Neovim `:checkhealth vim.lsp` shows where it is; VS Code's Output panel, "Org Language Server"; Helix `:log-open`).
      render: text
