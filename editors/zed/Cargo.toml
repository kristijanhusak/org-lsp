[package]
name = "zed_org_lsp"
version = "0.1.3"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# Built for Zed (wasm32-wasip2), apart from the server's workspace.
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
flate2 = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
zed_extension_api = "0.7.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
