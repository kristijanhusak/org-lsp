name = "Org"
grammar = "org"
# `org-agenda` is the agenda, the file the server writes. It is Org too:
# for a file outside the project Zed starts another server unless one
# already runs for that file's language, and another would not know the
# agenda.
path_suffixes = ["org", "org_archive", "org-agenda"]
line_comments = ["# "]
tab_size = 2
