id = "org-lsp"
name = "Org (org-lsp)"
description = "Org mode through the org-lsp language server: highlighting, completion, outline, TODO states, clocking, the agenda and capture. Org's keys and tasks come from `install.sh zed` (see docs/zed.org)."
version = "0.1.1"
schema_version = 1
authors = ["Kristijan Husak"]
repository = "https://github.com/kristijanhusak/org-lsp"

[language_servers.org-lsp]
name = "org-lsp"
languages = ["Org"]
# The server's code actions are of its own kinds (`org.todo.next`, …); Zed
# asks only for the kinds named here, and without them for none of these.
code_action_kinds = ["org"]

[language_servers.org-lsp.language_ids]
"Org" = "org"

[grammars.org]
repository = "https://github.com/milisims/tree-sitter-org"
commit = "64cfbc213f5a83da17632c95382a5a0a2f3357c1"
