[workspace]
resolver = "2"
members = ["server/org-syntax", "server/org-core", "server/org-lsp", "site"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/kristijanhusak/org-lsp"
publish = false

# Cargo's 16 codegen units, not one: one made the server's crates take
# 2.8 times as long to build (463 s against 167 s on four cores) for a
# binary a tenth smaller (17.3 MB against 19.2) and no faster.
[profile.release]
lto = "thin"
strip = true

# Line numbers alone in the debug builds' backtraces: each test binary
# is a seventh of its size with all of the debug information (2.5 GB for all
# of them against 17).
[profile.dev]
debug = "line-tables-only"

# The tests parse a lot of text (every prefix of each fixture, random edits,
# commands at every position): the parser built for speed in the debug
# builds the tests use, still with their checks (`debug-assertions`,
# `overflow-checks`).
[profile.dev.package.org-syntax]
opt-level = 2

[profile.dev.package.rowan]
opt-level = 2
