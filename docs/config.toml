# the file followed by the link's `::` part), `directory`, `remote`, `system`
# (what `C-u C-u C-c C-o` uses), `auto-mode` (every file the editor can show)
# or `t` (any other file). A command is `emacs` (the editor), `default` (the
# `system` entry, else the editor), `system` or `mailcap` (the system's
# application, through the editor), or a shell command where `%s` is the file.
# `C-u C-c C-o` opens the file in the editor. A Lisp function is not a command
# here. (org-file-apps)
org_file_apps = [["auto-mode", "emacs"], ["directory", "emacs"], ["\\.mm\\'", "default"], ["\\.x?html?\\'", "default"], ["\\.pdf\\'", "default"]]

