#:schema https://raw.githubusercontent.com/kristijanhusak/org-lsp/main/docs/config.schema.json

# The shared configuration file of org-lsp with every option at its default.
# Written by scripts/generate-docs.mjs from `org-lsp settings`: edit
# server/org-lsp/src/settings.rs, not this file.
#
# Copy it to ~/.config/org-lsp/config.toml and change what you want different;
# the options left as they are can as well go. An option that has no default
# here (it depends on something else) is a comment. docs/configuration.org
# says more about each.


# ----- TODO keywords and logging

# The TODO sequence, written like Org's `#+TODO:` line. `|` separates the
# states that count as done; without it the last keyword is the only done
# state. `TODO(t)` gives a keyword a key for fast selection, and `WAIT(w@/!)`
# makes it log a note (`@`) or the time (`!`) on entering and leaving it.
# Several sequences go in a list of lists, `[["TODO", "|", "DONE"], ["REPORT",
# "|", "FIXED"]]`; cycling stays in the sequence of the entry, and
# `C-S-<right>` switches to the next. A list that starts with `type` is a type
# sequence (`#+TYP_TODO:`): each of its keywords goes straight to done. A
# file's own `#+TODO:` lines take precedence. (org-todo-keywords)
org_todo_keywords = ["TODO", "|", "DONE"]

# What a list of keywords alone in `org_todo_keywords` is (Org's old syntax):
# a sequence, or types, each going straight to done. A list that starts with
# `sequence` or `type` says it itself. (org-todo-interpretation)
org_todo_interpretation = "sequence"

# Faces for particular TODO keywords: a color, `{ "WAIT": "orange" }`, or
# attributes written as Org writes them, `{ "CANCELLED": ":foreground gray
# :slant italic :strike-through t" }` (`:foreground`, `:background`, `:weight
# bold`, `:slant italic`, `:underline t`, `:strike-through t`). Shown in Org
# files and in the agenda by Neovim, Vim and VS Code. (org-todo-keyword-faces)
org_todo_keyword_faces = {}

# Write `CLOSED:` with the time when an entry is done, and with `note` ask for
# a note too. A file's `#+STARTUP:` words `logdone`, `lognotedone` and
# `nologdone` change it there; an entry's `LOGGING` property (inherited) says
# what its state changes log instead: those words, `logrepeat` and its
# relatives, and keywords with what they log (`WAIT(@/!)`), or `nil` for
# nothing. (org-log-done)
org_log_done = false

# Record when a repeating entry is done and moves to its next date.
# `#+STARTUP:` `logrepeat`, `lognoterepeat` and `nologrepeat` change it in a
# file, and the `LOGGING` property in an entry. (org-log-repeat)
org_log_repeat = "time"

# `S-<left>` and `S-<right>` on a headline change its TODO state as any change
# does: logged, and blocked by its dependencies. Off, they change it with
# nothing logged and nothing in the way.
# (org-treat-S-cursor-todo-selection-as-state-change)
org_treat_S_cursor_todo_selection_as_state_change = true

# The keyword of a heading `org.insert.todo.heading` (M-S-RET) makes is set as
# a TODO change: logged as the keyword says (a note wanted is a time only),
# with its tag triggers. (org-treat-insert-todo-heading-as-state-change)
org_treat_insert_todo_heading_as_state_change = false

# A tag that `org.ordered.toggle` (`C-c C-x o`) puts on the headline with the
# `ORDERED` property and takes off without it: `true` for `ORDERED`, or a tag
# of your own. Only the property orders the subtasks.
# (org-track-ordered-property-with-tag)
org_track_ordered_property_with_tag = false

# An entry cannot be done while a child is not, or, under a parent with the
# `ORDERED` property, while an earlier sibling is not: the change is refused
# with what blocks it. (org-enforce-todo-dependencies)
org_enforce_todo_dependencies = false

# An entry cannot be done while it has an unchecked box.
# (org-enforce-todo-checkbox-dependencies)
org_enforce_todo_checkbox_dependencies = false

# Record when an entry is refiled (`Refiled on [2026-05-18 Mon 10:30]`), with
# `note` asking for a note too. `#+STARTUP:` `logrefile`, `lognoterefile` and
# `nologrefile` change it in the file refiled to. (org-log-refile)
org_log_refile = false

# Record when a scheduled date changes or is removed (`Rescheduled from
# "[2026-05-18 Mon]" on …`), with `note` asking for a note too. `#+STARTUP:`
# `logreschedule`, `lognotereschedule` and `nologreschedule` change it in a
# file. (org-log-reschedule)
org_log_reschedule = false

# Record when a deadline changes or is removed (`New deadline from …`), with
# `note` asking for a note too. `#+STARTUP:` `logredeadline`,
# `lognoteredeadline` and `nologredeadline` change it in a file.
# (org-log-redeadline)
org_log_redeadline = false

# Put state changes and notes into a drawer: `true` for `LOGBOOK`, or the name
# of a drawer. `#+STARTUP:` `logdrawer` and `nologdrawer` change it in a file;
# an entry's `LOG_INTO_DRAWER` property (inherited) says which drawer for it
# (`t` for `LOGBOOK`, `nil` for none). (org-log-into-drawer)
org_log_into_drawer = false

# The `CLOSED:` timestamp of an entry done has the time, not only the date.
# (org-log-done-with-time)
org_log_done_with_time = true

# The heading of each kind of note, by kind: `done` (`CLOSING NOTE %t`),
# `state` (`State %-12s from %-12S %t`), `note`, `reschedule`, `delschedule`,
# `redeadline`, `deldeadline`, `refile` and `clock_out`. In a heading `%t` is
# the time, `%T` the time active, `%d` and `%D` the date, `%s` the new state
# or date and `%S` the old one, `%u` the login name and `%U` the full name; an
# empty heading leaves the note its text only. Kinds left out keep Org's
# headings. Habits take notes with the `done` heading for days done.
# (org-log-note-headings)
# org_log_note_headings = … (unset: Org's headings)

# Put a new state note, note or clock line above the others (`false`: below
# them). `#+STARTUP:` `logstatesreversed` and `nologstatesreversed` change it
# in a file. (org-log-states-order-reversed)
org_log_states_order_reversed = true

# Without a log drawer, put notes after the drawers right under the headline
# and planning line, not before them.
# (org-log-state-notes-insert-after-drawers)
org_log_state_notes_insert_after_drawers = false

# Ask for a note when the clock stops (`org.clock.out`), which goes right
# after the clock line. `#+STARTUP:` `lognoteclock-out` and
# `nolognoteclock-out` change it in a file. (org-log-note-clock-out)
org_log_note_clock_out = false

# Update the `[1/3]` and `[33%]` cookies of the parent when a state changes,
# counting the entries with a keyword (`true`), every entry (`all-headlines`,
# those without a keyword as not done), those with these keywords and the done
# ones (a list), or those of the first list as not done and of the second as
# done (two lists). `false` leaves the cookies. (org-provide-todo-statistics)
org_provide_todo_statistics = true

# TODO statistics count the children only; `false`: the whole subtree, and the
# cookies above too. A `COOKIE_DATA` property with `recursive` does this for a
# subtree. (org-hierarchical-todo-statistics)
org_hierarchical_todo_statistics = true

# Keep the `CLOSED:` timestamp when an entry is left with no keyword.
# (org-closed-keep-when-no-todo)
org_closed_keep_when_no_todo = false

# Tags that change with the state, by state: a keyword, `""` for none, `todo`
# for any not done, `done` for any done; each a list of tags to set (`+TAG`)
# or remove (`-TAG`), in order: `{ "WAIT": ["+waiting"], "todo": ["-done"],
# "done": ["+done", "-waiting"] }`. (org-todo-state-tags-triggers)
# org_todo_state_tags_triggers = … (unset: none)

# How `C-c C-t` (`org.todo`) changes the TODO state where keywords have keys
# (`TODO(t)`): `auto` picks the state by key from a menu of them; `expert` by
# key too, the keys listed in the prompt alone (in Neovim and Vim; other
# editors show their menu); `false` goes to the next state, as where no
# keyword has a key. `true` is `auto`. (org-use-fast-todo-selection)
org_use_fast_todo_selection = "auto"

# The state a repeating entry returns to when it is done: a keyword, or `true`
# for the state it had. (org-todo-repeat-to-state)
# org_todo_repeat_to_state = … (unset: the first keyword of the sequence)


# ----- Priorities

# Faces for particular priorities, by their letter, written as in
# `org_todo_keyword_faces`: `{ "A": ":foreground red :weight bold" }`.
# (org-priority-faces)
org_priority_faces = {}

# Whether the priority commands work. With `false` they refuse (`Priority
# commands are disabled`), and `S-<up>` and `S-<down>` on a headline do not
# change its priority. (org-priority-enable-commands)
org_priority_enable_commands = true

# The highest priority. (org-priority-highest)
org_priority_highest = "A"

# The lowest priority. (org-priority-lowest)
org_priority_lowest = "C"

# The priority of an entry without a cookie. A file's `#+PRIORITIES:` line
# takes precedence over the three priority options. (org-priority-default)
org_priority_default = "B"

# Raising or lowering the priority of an entry that has none starts at the
# default. (org-priority-start-cycle-with-default)
org_priority_start_cycle_with_default = true


# ----- Tags and properties

# Faces for particular tags of headlines, written as in
# `org_todo_keyword_faces`: `{ "work": "orange" }`. Shown in Org files (not
# the agenda, as in Emacs) by Neovim, Vim and VS Code. (org-tag-faces)
org_tag_faces = {}

# Where tags are aligned after a change to a headline. Negative: they end at
# that column. (org-tags-column)
org_tags_column = -77

# Which tags entries inherit from their parents and from `#+FILETAGS:`: `true`
# for all, `false` for none, a list of tags, or a regexp (Emacs syntax) tags
# must match. Inherited tags count in tag searches and show in the agenda.
# (org-use-tag-inheritance)
org_use_tag_inheritance = true

# Tags never inherited, when `org_use_tag_inheritance` is `true` or a regexp.
# (org-tags-exclude-from-inheritance)
org_tags_exclude_from_inheritance = []

# Which properties an entry without them takes from its parents, the file's
# property drawer and `#+PROPERTY:` lines, in property searches
# (`OWNER="alice"`): `true` for all, `false` for none, a list of names, or a
# regexp (Emacs syntax). `CATEGORY` and `ARCHIVE` are always inherited.
# (org-use-property-inheritance)
org_use_property_inheritance = false

# What joins the values of a property with those of its `PROPERTY+` lines, and
# the inherited ones, instead of a space: `[["AUTHOR", "COAUTHOR"], ", "]` for
# the properties named, `["^TAG", ";"]` for those an Emacs regexp matches,
# without regard to case. The first that fits counts.
# (org-property-separators)
org_property_separators = []

# How a property line is written when it is indented (TAB, `org.indent`) or
# set: `format`'s `%s` for the key with its colons, then the value, with a
# width (`%-10s` pads the key to 10 columns). (org-property-format)
org_property_format = "%-10s %s"

# Properties every entry inherits, after those of `#+PROPERTY:` lines: chiefly
# the allowed values of a property, which setting it offers and `S-<right>`
# and `S-<left>` go through on its line (`{ "Effort_ALL": "0:10 0:30 1:00
# 2:00" }`; `:ETC` allows others too). (org-global-properties)
org_global_properties = {}

# Completing a tag offers the tags of every agenda file, after those of the
# file. Off, only the file's own. Setting tags offers them too.
# (org-complete-tags-always-offer-all-agenda-tags)
org_complete_tags_always_offer_all_agenda_tags = false

# The tags offered when setting tags in a file without a `#+TAGS:` line,
# written like one: `"work(w) home(h) { @office(o) @home(m) } [ GTD : Control
# Persp ]"` gives `work` the key `w`, makes `@office` and `@home` exclusive,
# and groups `Control` and `Persp` under `GTD`; `\n` starts a new line. A list
# of these words does as well. Unset, the tags used in the file are offered.
# (org-tag-alist)
org_tag_alist = ""

# Tags offered in every file, before those of `#+TAGS:` or `org_tag_alist`,
# written the same way. (org-tag-persistent-alist)
org_tag_persistent_alist = ""

# A group tag (`[ GTD : Control Persp ]`, `{ Context : @home @office }` in
# `#+TAGS:` or `org_tag_alist`) in the match string of a tags view stands for
# itself and the tags of its group. (org-group-tags)
org_group_tags = true

# Pick tags by key, each key turning its tag on or off until RET: `auto` when
# some tag has a key, `true` always (keys are given to the tags without one),
# `false` never: the tags are typed instead. (org-use-fast-tag-selection)
org_use_fast_tag_selection = "auto"

# In fast tag selection, the first key that changes the tags also ends it.
# (org-fast-tag-selection-single-key)
org_fast_tag_selection_single_key = false

# Sort the tags of a headline when they are set: alphabetically, or the other
# way. (org-tags-sort-function)
# org_tags_sort_function = … (unset: the order they were picked in)

# Align the tags of a headline to `org_tags_column` when they are set.
# (org-auto-align-tags)
org_auto_align_tags = true

# Whether tags matches (agenda, sparse trees) and stuck projects list the
# entries below one they list: `false` passes over its subtree, `indented`
# shows them with a dot for each level below the first.
# (org-tags-match-list-sublevels)
org_tags_match_list_sublevels = true


# ----- Lists

# Whether a letter may stand for the number of an ordered item (`a.`, `B)`). A
# list of more than 26 items is numbered. (org-list-allow-alphabetical)
org_list_allow_alphabetical = false

# What ends the number of an ordered item: `"."`, `")"`, or `true` for either.
# (org-plain-list-ordered-item-terminator)
org_plain_list_ordered_item_terminator = true

# An Emacs regexp: the bullets it matches get two spaces after them when Org
# writes them (a new item, a bullet changed, a list repaired).
# (org-list-two-spaces-after-bullet-regexp)
org_list_two_spaces_after_bullet_regexp = false

# By bullet (`-`, `+`, `*`, `1.`, `1)`), the bullet an item gets when it is
# indented: `{ "+": "-", "-": "+" }`. (org-list-demote-modify-bullet)
org_list_demote_modify_bullet = {}

# How many more columns sub-items are indented, past their parent's bullet.
# (org-list-indent-offset)
org_list_indent_offset = 0

# `checkbox`: the statistics cookies are counted again when a box changes, and
# colored as done or not. `indent`: indenting the first item of a list with
# its children (M-S-<right>) moves the whole list. A rule left out of the
# object is off. (org-list-automatic-rules)
org_list_automatic_rules = { checkbox = true, indent = true }

# A checkbox cookie counts the boxes of the items right below it; `false`
# counts every box further down too, as `recursive` in a `COOKIE_DATA`
# property does. (org-checkbox-hierarchical-statistics)
org_checkbox_hierarchical_statistics = true

# Moving to the next item from the last goes to the first, and back; moving
# the last item down puts it first, the first up puts it last.
# (org-list-use-circular-motion)
org_list_use_circular_motion = false


# ----- Tables

# An Emacs regexp: the fields it matches are numbers, and a column mostly of
# numbers aligns right. (org-table-number-regexp)
# org_table_number_regexp = … (unset: Org's: integers, decimals, `2.4e-08`,
# `0x1F`, `nan`, `inf` and their relatives)

# How much of a column's filled fields must be numbers for it to align right.
# (org-table-number-fraction)
org_table_number_fraction = 0.5

# TAB and RET in a table align it before they move; `false`: only C-c C-c and
# the commands that change rows or columns do. (org-table-automatic-realign)
org_table_automatic_realign = true

# TAB at the end of a row before a horizontal line goes to the row after it;
# `false`: it makes a row before the line. (org-table-tab-jumps-over-hlines)
org_table_tab_jumps_over_hlines = true

# What shows at the end of each field of a shrunk column.
# (org-table-shrunk-column-indicator)
org_table_shrunk_column_indicator = "…"

# Constants for the table formulas of every file, by name: `{ "c":
# "299792458." }` gives `$c`. A file's `#+CONSTANTS:` come first.
# (org-table-formula-constants)
org_table_formula_constants = {}

# Whether a relative reference in a formula (`@-1`) goes past a horizontal
# line: `false` stops at the field next to it, `"error"` makes the formula
# fail. (org-table-relative-ref-may-cross-hline)
org_table_relative_ref_may_cross_hline = true

# A field formula past the last column adds the columns it needs, rather than
# failing. (org-table-formula-create-columns)
org_table_formula_create_columns = false

# How a formula with `;t` writes a duration: a number of seconds, minutes,
# hours or days, or hours and minutes. (org-table-duration-custom-format)
org_table_duration_custom_format = "hours"

# Durations of formulas (`;T`, `;U`) have their hours on two digits:
# `08:32:34` rather than `8:32:34`. (org-table-duration-hour-zero-padding)
org_table_duration_hour_zero_padding = true

# The modes table formulas start with: `float_format`, `["float", digits]`,
# `["fix", decimals]` or `["sci", digits]`, and `angle_mode`, `"deg"` or
# `"rad"`. A formula's own modes (`;f2`) win; Calc's other modes are not
# offered. (org-calc-default-modes)
org_calc_default_modes = { float_format = ["float", 8], angle_mode = "deg" }

# TAB and RET on a field that is a formula (`=$1*2`, `:=...`) evaluate it,
# which org-lsp refuses (the formula goes in a `#+TBLFM:` line); `false`
# leaves the field as text. (org-table-formula-evaluate-inline)
org_table_formula_evaluate_inline = true

# TAB, RET and C-c C-c on a line marked `#` recalculate it.
# (org-table-allow-automatic-line-recalculation)
org_table_allow_automatic_line_recalculation = true


# ----- Links, IDs and citations

# How a new `ID` is made (`org.id.create`, a link stored by ID, org-roam): a
# random UUID, the time in base 36 (`org`), or the time as `org_id_ts_format`
# writes it (`ts`). (org-id-method)
org_id_method = "uuid"

# What a new `ID` starts with, before a colon: `"Org"` makes `Org:…`.
# (org-id-prefix)
org_id_prefix = false

# How the `ts` method writes the time, as `format-time-string` does.
# (org-id-ts-format)
org_id_ts_format = "%Y%m%dT%H%M%S.%6N"

# The `org` and `ts` methods end a new `ID` with `@` and the machine's domain.
# (org-id-include-domain)
org_id_include_domain = false

# IDs are looked for in other files than the link's own: those of
# `org_id_search_archives`, `org_id_extra_files` and `org_id_locations_file`,
# the agenda files, the open ones and org-roam's. Off, an `id:` link leads
# only within its file. (org-id-track-globally)
org_id_track_globally = true

# IDs are looked for in the archive files of the agenda files too.
# (org-id-search-archives)
org_id_search_archives = true

# More files to look for IDs in: paths or glob patterns. (org-id-extra-files)
# org_id_extra_files = … (unset: `org_agenda_text_search_extra_files`)

# The file where Emacs keeps the files it found IDs in: org-lsp looks in them
# too, and never writes it. Names in it that are not absolute are relative to
# its directory. (org-id-locations-file)
org_id_locations_file = "~/.emacs.d/.org-id-locations"

# The headlines an `id:` link completes to (`org.link.insert`), as
# `org_refile_targets` names them: by default every headline of the file and
# of the files with IDs. (org-id-completion-targets)
org_id_completion_targets = [{ files = "current", all = true }, { files = "org-id-files", all = true }]

# What a link to a headline that is not there does: `"query-to-create"` asks
# whether to make it, at the end of the file, when the link is followed
# (`org.open`); `true` is an error; `false` looks for its words in the text.
# (org-link-search-must-match-exact-headline)
org_link_search_must_match_exact_headline = "query-to-create"

# What a `doi:` link is opened at: this, then the DOI.
# (org-link-doi-server-url)
org_link_doi_server_url = "https://doi.org/"

# An Emacs regexp: a `shell:` link whose command it matches runs when followed
# without asking `Execute … in shell?` first. Empty asks for every command.
# (org-link-shell-skip-confirm-regexp)
org_link_shell_skip_confirm_regexp = ""

# Whether `org.link.store` (`C-c l`) links to an entry by its ID: `true` makes
# one when the entry has none, `"create-if-interactive"` only from the command
# (not for capture's `%a`), `"create-if-interactive-and-no-custom-id"`
# likewise unless the entry has a `CUSTOM_ID`, `"use-existing"` only when it
# has one already. Off, the link searches for the headline.
# (org-id-link-to-org-use-id)
org_id_link_to_org_use_id = false

# Links to a place in a file search for it (`file:notes.org::*Heading`); `C-u`
# turns it around for one link. (org-link-context-for-files)
org_link_context_for_files = true

# ID links to a place below the entry's headline search for it as well
# (`id:…::name`). (org-id-link-use-context)
org_id_link_use_context = true

# An ID link may use the ID of a parent entry, with a search for the place.
# (org-id-link-consider-parent-id)
org_id_link_consider_parent_id = false

# How links to files write the path: `"adaptive"` relative below the file's
# directory and absolute elsewhere, `"absolute"` (with `~`), `"noabbrev"`
# (without), `"relative"`. (org-link-file-path-type)
org_link_file_path_type = "adaptive"

# Stored links stay stored once inserted.
# (org-link-keep-stored-after-insertion)
org_link_keep_stored_after_insertion = false

# Bibliography files for the citations of every document (`[cite:@key]`),
# after those its `#+BIBLIOGRAPHY:` lines name: BibTeX (`.bib`, `.bibtex`) or
# CSL-JSON (`.json`). Their entries are completed after `@`, shown over a key,
# and where following a key goes; a key none has is marked.
# (org-cite-global-bibliography)
org_cite_global_bibliography = []

# The citation processor `org.cite.insert` inserts with: `basic`, as Org's own
# does; Org's other processors cannot insert, and those of packages (citar)
# are not run; `false` for none. (org-cite-insert-processor)
org_cite_insert_processor = "basic"

# Whether `org.bibtex.create` and `org.bibtex.check` make the key of a new
# BibTeX entry from its author, year and title, as `bibtex-generate-autokey`
# makes it (through Emacs), instead of asking for it (`id`).
# (org-bibtex-autogen-keys)
org_bibtex_autogen_keys = false

# What the names of the properties the BibTeX commands write start with
# (`BIB_` gives `BIB_AUTHOR`), but for the key's; they read the names with it
# and without. (org-bibtex-prefix)
# org_bibtex_prefix = … (unset: none)

# A headline without a `TITLE` property is the title of its BibTeX entry, and
# `org.bibtex.check` does not ask for one.
# (org-bibtex-treat-headline-as-title)
org_bibtex_treat_headline_as_title = true

# With `org_bibtex_prefix`, every property whose name has the prefix is a
# field of the entry exported (`org.bibtex.export`, `org.bibtex.copy`), not
# only those of its type. (org-bibtex-export-arbitrary-fields)
org_bibtex_export_arbitrary_fields = false

# The property that holds an entry's BibTeX key. `ID` makes the key a global
# ID. (org-bibtex-key-property)
org_bibtex_key_property = "CUSTOM_ID"

# Tags given to the entries the BibTeX commands make. (org-bibtex-tags)
org_bibtex_tags = []

# The `keywords` field of an entry read is its tags (spaces as `_`, other
# characters a tag cannot have left out), and an entry's own tags are its
# `keywords` when exported, but for those of `org_bibtex_tags` and
# `org_bibtex_no_export_tags`. (org-bibtex-tags-are-keywords)
org_bibtex_tags_are_keywords = false

# Tags that are not exported as keywords, with `org_bibtex_tags_are_keywords`.
# (org-bibtex-no-export-tags)
org_bibtex_no_export_tags = []

# With `org_bibtex_tags_are_keywords`, the tags an entry inherits are keywords
# too. (org-bibtex-inherit-tags)
org_bibtex_inherit_tags = false

# The property that holds an entry's BibTeX type (`article`); a headline
