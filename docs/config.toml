org_timestamp_custom_formats = ["%m/%d/%y %a", "%m/%d/%y %a %H:%M"]

# How many months the calendar of the date prompt shows: 3 side by side, as
# Emacs's calendar shows them, the one with the selected day in the middle; or
# 1, that month alone, for a narrow window, with the answer on a line under
# the prompt.
calendar_months = 3

# The day the weeks of the date prompt's calendar start on: 1 starts them on
# Monday. (calendar-week-start-day)
calendar_week_start_day = 0

# How durations are written (clock tables, clock lines, efforts): `"h:mm"` or
# `"h:mm:ss"`, or a list of units each with whether it is written when zero
# (`["d", false]`), with perhaps `["special", "h:mm"]` (the hours and minutes
# as `H:MM` after the larger units), `["special", "h:mm:ss"]`, `["special",
# 2]` (one unit with 2 decimals) and `"compact"` (no space between units). The
# units are those of `org_duration_units`. (org-duration-format)
org_duration_format = [["d", false], ["special", "h:mm"]]

# The units of durations and the minutes in each, for reading efforts and
# writing durations: `["d", 480]` for days of 8 hours. (org-duration-units)
org_duration_units = [["min", 1], ["h", 60], ["d", 1440], ["w", 10080], ["m", 43200], ["y", 525960]]

