org_bibtex_type_property_name = "btype"

# Link abbreviations: `[[gh:org-lsp]]` with `{ "gh": "https://github.com/%s"
# }` follows `https://github.com/org-lsp`. `%s` stands for what follows the
# colon, `%h` for it URL-encoded; without either it goes at the end. A file's
# `#+LINK:` lines come first. `%(my-function)` calls an Emacs function with
# what follows the colon (through Emacs), one `emacs_config` marks safe, as
# Org asks: `(put 'my-function 'org-link-abbrev-safe t)`.
# (org-link-abbrev-alist)
org_link_abbrev_alist = {}

# What opens a linked file, the first entry that matches: a match is an
# extension (`txt`), an Emacs regular expression for the file name
