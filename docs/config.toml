org_image_max_width = "fill-column"

# Show the images of links to image files in place when a file opens, as `C-c
# C-x C-v` (`org.link.preview`) shows them. `#+STARTUP: inlineimages` (or
# `linkpreviews`) and `noinlineimages` decide for a file. Editors that can
# show images: Neovim from 0.13 (`vim.ui.img`), in a terminal with the Kitty
# graphics protocol. (org-startup-with-link-previews)
org_startup_with_link_previews = false

# Show the LaTeX fragments as images when a file opens, as `C-c C-x C-l`
# (`org.latex.preview`) shows them, made by Emacs. `#+STARTUP: latexpreview`
# and `nolatexpreview` decide for a file. (org-startup-with-latex-preview)
org_startup_with_latex_preview = false

# Show files indented by level without changing them (`org-indent-mode`): the
# text under a headline lines up with its title, and leading stars are hidden.
# `#+STARTUP: indent` and `noindent` decide for a file. It turns
# `org_adapt_indentation` off in such files, unless that is `"headline-data"`.
# The lines a long line wraps into go on under its text, a headline's title or
# an item's text (`wrap-prefix`) in Neovim and Vim, without the prefix; under
# the prefix in Zed and Helix. (org-startup-indented)
org_startup_indented = false

# Number the headlines of files (`org-num-mode`): `1`, `1.1`, `1.2`… after the
# stars, shown as inlay hints without changing the file. `#+STARTUP: num` and
# `nonum` decide for a file, and `org.num.mode` turns it on and off.
# (org-startup-numerated)
org_startup_numerated = false

# Hide all the stars of a headline but the last; they keep their place.
# `#+STARTUP: hidestars` and `showstars` decide for a file.
# (org-hide-leading-stars)
org_hide_leading_stars = false

# Where `org_startup_indented` (or `#+STARTUP: indent`) shows a file indented,
# hide the leading stars too, whatever `org_hide_leading_stars` says.
# (org-indent-mode-turns-on-hiding-stars)
org_indent_mode_turns_on_hiding_stars = true

# Where a file shows indented, `org_adapt_indentation` is off (unless it is
# `headline-data`): new and moved text is not indented to its headline.
# (org-indent-mode-turns-off-org-adapt-indentation)
org_indent_mode_turns_off_org_adapt_indentation = true

# How many columns a file shown indented moves each level of headlines and
# their text in; 0 shows them as they are. (org-indent-indentation-per-level)
org_indent_indentation_per_level = 2

# Show a headline marked done in the look of done headlines past its keyword
# (`org-headline-done`). (org-fontify-done-headline)
org_fontify_done_headline = true

# Show a headline marked with a keyword not done in the look of TODO headlines
# past its keyword (`org-headline-todo`, the token modifier `todo`).
# (org-fontify-todo-headline)
org_fontify_todo_headline = false

# Show the lines inside quote and verse blocks in their own look (`org-quote`,
# `org-verse`: the token types `quote` and `verse`).
# (org-fontify-quote-and-verse-blocks)
org_fontify_quote_and_verse_blocks = false

# Show the look of a headline's level past the end of its text, to the edge of
# the window: for looks with a background. Editors that can show it: Neovim,
# Vim and VS Code (`org-lsp/lineHighlights`, VS Code's colors
# `org.headlineLevel1Background` and on). (org-fontify-whole-heading-line)
org_fontify_whole_heading_line = false

# What a closed fold shows after its first line, such as `" ▾"`, in the
# highlight group `OrgLspEllipsis` (Neovim). Editors that can show it: Neovim
# and Vim. (org-ellipsis)
# org_ellipsis = … (unset: the standard three dots, `...`)

# org-bullets: the last star of each headline shows as a bullet, those of
# `org_bullets_bullet_list` by level, and the stars before it are hidden, as
# with `org_hide_leading_stars`. (org-bullets-mode)
org_bullets_mode = false

# The bullets of `org_bullets_mode`, one a level, repeating after the last.
# (org-bullets-bullet-list)
org_bullets_bullet_list = ["◉", "○", "✸", "✿"]

# What `org_bullets_mode` shows in place of the `-`, `+` or `*` of an item, as
# org-bullets.nvim does; `false` leaves them as they are.
org_bullets_list_bullet = "•"

# What `org_bullets_mode` shows between the brackets of a checkbox, `[ ]`,
# `[-]` and `[X]`, as org-bullets.nvim does; `false` leaves them as they are.
# A state left out keeps its default.
org_bullets_checkboxes = { todo = " ", half = "-", done = "✓" }


# ----- Source blocks and tangling

# Leave the code of source blocks as it is indented when re-indenting.
# (org-src-preserve-indentation)
org_src_preserve_indentation = false

# By language, the extension of the file `:tangle yes` writes its blocks to,
# before Org's own (`emacs-lisp` → `el`): `{ "python": "py" }`. A language
# without one gives its name. (org-babel-tangle-lang-exts)
org_babel_tangle_lang_exts = {}

# Whether the link comments of tangled files (`:comments link`) point back to
# the Org file by a relative path; with `false` by its whole path.
# (org-babel-tangle-use-relative-file-links)
org_babel_tangle_use_relative_file_links = true

# The comment before a tangled block (`:comments link`): `%link` the link back
# to it, `%source-name` its name, `%file` the Org file, `%start-line` the line
# its code starts on. (org-babel-tangle-comment-format-beg)
org_babel_tangle_comment_format_beg = "[[%link][%source-name]]"

# The comment after a tangled block, with the keys of
# `org_babel_tangle_comment_format_beg`. (org-babel-tangle-comment-format-end)
org_babel_tangle_comment_format_end = "%source-name ends here"

# Write the comments of tangled blocks as they are: not commented, and no line
# break after them. (org-babel-tangle-uncomment-comments)
org_babel_tangle_uncomment_comments = false

# The function the Org text of `:comments org` goes through:
# `org-remove-indentation` takes its common indentation away, `identity`
# leaves it; Emacs tangles with any other. (org-babel-process-comment-text)
org_babel_process_comment_text = "org-remove-indentation"

# In octal, the mode a symbolic `:tangle-mode` (`u+x`) changes.
# (org-babel-tangle-default-file-mode)
org_babel_tangle_default_file_mode = "644"

# Whether a file tangling writes again is deleted first: `true` always (a link
# to it becomes a file of its own), `false` never (a read-only file refuses),
# `"auto"` when it is read-only. (org-babel-tangle-remove-file-before-write)
org_babel_tangle_remove_file_before_write = "auto"

# What opens a Noweb reference in a source block (`<<name>>`).
# (org-babel-noweb-wrap-start)
org_babel_noweb_wrap_start = "<<"

# What closes a Noweb reference. (org-babel-noweb-wrap-end)
org_babel_noweb_wrap_end = ">>"

# How far code is indented past its source block: when re-indenting, and when
# the code of a block edited in a file of its own (`C-c '`) is written back.
# Formerly `org_edit_src_content_indentation`, which is still read.
# (org-src-content-indentation)
org_src_content_indentation = 2


# ----- org-super-agenda

# org-super-agenda: show the lines of the agenda's views in the groups of
# `org_super_agenda_groups`, each under a header. Off, the groups are not
# used. (org-super-agenda-mode)
org_super_agenda_mode = false

# org-super-agenda's groups, in turn taking the lines they select: each an
# object of selectors and their arguments in Emacs's order, `{ name = "Today",
# time-grid = true }`, or a list of them in turn; `true` is `t`, `false` is
# `nil` (and for `name`, `none`: no header). The lines no group takes come
# last, under `org_super_agenda_unmatched_name`. In a custom command's
# `settings`, the groups of that command or block. (org-super-agenda-groups)
org_super_agenda_groups = []

# The header of the lines no group takes. (org-super-agenda-unmatched-name)
org_super_agenda_unmatched_name = "Other items"

# Where the lines no group takes come among the groups: groups show lowest
# `order` first. (org-super-agenda-unmatched-order)
org_super_agenda_unmatched_order = 99

# What goes before each header: text, or one character repeated across the
# window, then a newline. (org-super-agenda-header-separator)
org_super_agenda_header_separator = "\n"

# What each header starts with. (org-super-agenda-header-prefix)
org_super_agenda_header_prefix = " "

# What goes after the last group: text put at the end of its last line, or one
# character repeated across the window on a line of its own.
# (org-super-agenda-final-group-separator)
org_super_agenda_final_group_separator = ""

# The headers of the groups of `auto-planning` and `auto-ts`, as
# `format-time-string` writes dates. (org-super-agenda-date-format)
org_super_agenda_date_format = "%e %B %Y"

# Leave out the headers of groups whose lines the agenda's filters all hide.
# (org-super-agenda-hide-empty-groups)
org_super_agenda_hide_empty_groups = false

# Sort the lines of each group again, as the view sorts its lines: a group of
# several selectors puts the lines of its first selector first.
# (org-super-agenda-keep-order)
org_super_agenda_keep_order = false

# The property `auto-group` groups lines by.
# (org-super-agenda-group-property-name)
org_super_agenda_group_property_name = "agenda-group"

# Look for the properties of `property`, `auto-property` and `auto-group` in
# the entries above too. (org-super-agenda-properties-inherit)
org_super_agenda_properties_inherit = true


# ----- org-roam

# org-roam: the files of `org_roam_directory` are a network of notes, whose
# nodes (files and entries with an `ID`) are found, linked to and made with
# the `org.roam.*` commands. Off, those commands only say so.
org_roam_enabled = false

# The directory of org-roam's files, in all its subdirectories. `~/` is the
# home directory. (org-roam-directory)
org_roam_directory = "~/org-roam/"

# The extensions of org-roam's files; each may be followed by `.gpg` or
# `.age`, which the server cannot read. (org-roam-file-extensions)
org_roam_file_extensions = ["org"]

# Emacs regexps for the files that are not org-roam's, matched against their
# names relative to `org_roam_directory`; the default leaves out attachments.
# (org-roam-file-exclude-regexp)
org_roam_file_exclude_regexp = ["data/"]

# How a node is offered: `${field}` for its `title`, `tags`, `todo`, `file`,
# `olp`, `aliases` and the other fields of `org-roam-node`, `${field:N}` in N
# columns, `${field:*}` in what is left of the window's 79 columns.
# (org-roam-node-display-template)
org_roam_node_display_template = "${title}"

# The description of a link `org.roam.node.insert` makes, a template as
# `org_roam_node_display_template` is (`${title} (${file})`); empty for the
# node's title. (org-roam-node-formatter)
org_roam_node_formatter = ""

# Where else org-roam finds links than where Org does: in property drawers
# (`node-property`) and keyword lines (`keyword`).
# (org-roam-db-extra-links-elements)
org_roam_db_extra_links_elements = ["node-property", "keyword"]

# By `node-property` and `keyword`, the properties and keywords whose links
# are not links, in any case. A list given replaces the default one.
# (org-roam-db-extra-links-exclude-keys)
org_roam_db_extra_links_exclude_keys = { node-property = ["ROAM_REFS"], keyword = ["transclude"] }

# The Graphviz program that draws `org.roam.graph`'s graph, found on `PATH` or
# a path. (org-roam-graph-executable)
org_roam_graph_executable = "dot"

# The program that shows the graph, given its file. (org-roam-graph-viewer)
# org_roam_graph_viewer = … (unset: the editor's: it opens the file as the
# system does)

# What Graphviz draws the graph as (its `-T`): `svg`, `png`, `pdf`…
# (org-roam-graph-filetype)
org_roam_graph_filetype = "svg"

# Graphviz's attributes of the graph, in their order: `{ "rankdir": "LR" }`.
# (org-roam-graph-extra-config)
org_roam_graph_extra_config = {}

# Graphviz's attributes of the links: `{ "dir": "back" }`.
# (org-roam-graph-edge-extra-config)
org_roam_graph_edge_extra_config = {}

# Graphviz's attributes of the nodes, by the type of the link to them: `id`
# for org-roam's nodes, `https` for the web pages linked to.
# (org-roam-graph-node-extra-config)
org_roam_graph_node_extra_config = { id = { style = "bold,rounded,filled", fillcolor = "#EEEEEE", color = "#C9C9C9", fontcolor = "#111111" }, http = { style = "rounded,filled", fillcolor = "#EEEEEE", color = "#C9C9C9", fontcolor = "#0A97A6" }, https = { style = "rounded,filled", fillcolor = "#EEEEEE", color = "#C9C9C9", fontcolor = "#0A97A6" } }

# The types of links the graph leaves out. (org-roam-graph-link-hidden-types)
org_roam_graph_link_hidden_types = ["file"]

# The width a title takes in the graph, at most.
# (org-roam-graph-max-title-length)
org_roam_graph_max_title_length = 100

# What becomes of a title wider than `org_roam_graph_max_title_length`: cut
# with `...` (`truncate`), over lines (`wrap`), or nothing (`false`).
# (org-roam-graph-shorten-titles)
org_roam_graph_shorten_titles = "truncate"

# The file `org.roam.extract` offers for a node, relative to
# `org_roam_directory`: `%<…>` is the time as `format-time-string` writes it,
# `${title}`, `${slug}` and `${id}` the node's.
# (org-roam-extract-new-file-path)
org_roam_extract_new_file_path = "%<%Y%m%d%H%M%S>-${slug}.org"

# Turn the `roam:` links of org-roam's files into `id:` links to their nodes
# as the files are saved, and as a link is followed.
# (org-roam-link-auto-replace)
org_roam_link_auto_replace = true

# In org-roam's files, offer the titles of the nodes for the word at the
# cursor, not only in a link; the one picked becomes a link to its node.
# (org-roam-completion-everywhere)
org_roam_completion_everywhere = false

# The sections of the org-roam buffer, in turn: `backlinks` (the nodes that
# link to the node), `reflinks` (those that link to or cite its references)
# and `unlinked-references` (the places that name it without a link, found by
# the server itself). (org-roam-mode-sections)
org_roam_mode_sections = ["backlinks", "reflinks"]

# The templates of new nodes, as `org_capture_templates` writes them, with
# org-roam's targets: `file` and a path, `file+head`, a path and the text a
# new file starts with, `file+olp`, a path and the headlines of an outline
# path, `file+head+olp`, both, and `node` and the title, alias or `ID` of a
# node. The path, relative to `org_roam_directory`, and the texts may have
# `${title}`, `${slug}`, `${id}` and `${name}`, which asks for `name`
# (`${name=default}` starts the answer with `default`), besides the escapes of
# `org_capture_templates`. `unnarrowed` shows the whole file in the capture
# buffer. (org-roam-capture-templates)
org_roam_capture_templates = [{ key = "d", description = "default", type = "plain", target = ["file+head", "%<%Y%m%d%H%M%S>-${slug}.org", "#+title: ${title}\n"], template = "%?", unnarrowed = true }]

# Where the daily notes are, relative to `org_roam_directory`.
# (org-roam-dailies-directory)
org_roam_dailies_directory = "daily/"

# The templates of the daily notes, as `org_roam_capture_templates` writes
# them, with paths relative to `org_roam_dailies_directory`; `%<…>` is the
# note's day. (org-roam-dailies-capture-templates)
org_roam_dailies_capture_templates = [{ key = "d", description = "default", type = "entry", target = ["file+head", "%<%Y-%m-%d>.org", "#+title: %<%Y-%m-%d>\n"], template = "* %?" }]


# ----- org-journal

# org-journal: a journal in `org_journal_dir`, a file a day (or week, month,
# year), written with the `org.journal.*` commands. Off, those commands only
# say so.
org_journal_enabled = false

# The directory of the journal's files. `~/` is the home directory.
# (org-journal-dir)
org_journal_dir = "~/Documents/journal/"

# A file a day (`daily`), week (`weekly`), month (`monthly`) or year
# (`yearly`); but daily, each entry has its date in a `CREATED` property.
# (org-journal-file-type)
org_journal_file_type = "daily"

# The day a weekly file starts on: 1 is Monday, 7 Sunday.
# (org-journal-start-on-weekday)
org_journal_start_on_weekday = 1

# The names of the files, as `format-time-string` writes the date their
# entries start on: with `%Y`, `%m` and `%d` (a yearly file needs only `%Y`, a
# monthly one `%Y` and `%m`). A name without `.org` is an Org file to
# org-journal, but not to most editors. (org-journal-file-format)
org_journal_file_format = "%Y%m%d"

# The date of an entry, after `org_journal_date_prefix`, as
# `format-time-string` writes it, in the C locale: `%x` is `10/09/26`.
# (org-journal-date-format)
org_journal_date_format = "%A, %x"

# What comes before the date of an entry: a headline, or `#+title: ` in a
# daily file. (org-journal-date-prefix)
org_journal_date_prefix = "* "

# The time of a new entry of the day, as `format-time-string` writes it; empty
# for none. (org-journal-time-format)
org_journal_time_format = "%R "

# The time of an entry made after midnight while it is still yesterday
# (`org_extend_today_until`); empty for `org_journal_time_format`.
# (org-journal-time-format-post-midnight)
org_journal_time_format_post_midnight = ""

# What comes before the time of an entry: its stars give its level.
# (org-journal-time-prefix)
org_journal_time_prefix = "** "

# Fold all but the new entry. (org-journal-hide-entries-p)
org_journal_hide_entries_p = true

# In the calendar (`org.goto.calendar`), the entry of the day `]` and `[` move
# to shows in another window. (org-journal-follow-mode)
org_journal_follow_mode = false

# Where a new entry and today's file (`org.journal.open.current`) show: in
# another window, or (`"find-file"`) in the window of the command.
# (org-journal-find-file-fn)
org_journal_find_file_fn = "find-file-other-window"

# The items of the entry before that move to today's, with the headlines above
# them: a match of the tags view (`m`); empty for none.
# (org-journal-carryover-items)
org_journal_carryover_items = "TODO=\"TODO\""

# Drawers left out of the items carried over.
# (org-journal-skip-carryover-drawers)
org_journal_skip_carryover_drawers = []

# What happens to an entry or file left empty by the carryover: `never`
# deleted, `always`, or `ask`. (org-journal-carryover-delete-empty-journal)
org_journal_carryover_delete_empty_journal = "never"

# What a new file starts with, as `format-time-string` writes it: `#+title:
# Journal %Y`. (org-journal-file-header)
org_journal_file_header = ""

# The date in the `CREATED` property of an entry of a file that is not daily.
# (org-journal-created-property-timestamp-format)
org_journal_created_property_timestamp_format = "%Y%m%d"

# What comes before the timestamp of an entry for a day to come
# (`org.journal.new.scheduled.entry`). (org-journal-scheduled-string)
org_journal_scheduled_string = ""

# Tag the date of a new entry with `crypt`, for `org-crypt` to encrypt
# (`org.crypt.encrypt.all`, or as the file is saved with
# `org-crypt-use-before-save-magic` in the Emacs configuration).
# (org-journal-enable-encryption)
org_journal_enable_encryption = false

# Add the journal's files of today and the days to come to the agenda's files.
# (org-journal-enable-agenda-integration)
org_journal_enable_agenda_integration = false

# The date of each result of a search of the journal, as `format-time-string`
# writes it. (org-journal-search-result-date-format)
org_journal_search_result_date_format = "%A, %x"

# The order of the results of a search of the journal: `asc`, the first day
# first, or `desc`, the last. (org-journal-search-results-order-by)
org_journal_search_results_order_by = "asc"


# ----- Editing and motion

# Inserting a heading, an item or a table row (M-RET) in the middle of a line
# splits it, the rest going to the new one; `false`: it goes in after the
# line. One by context: `{ "headline": false, "item": true, "table": true }`,
# `default` for those not named. (org-M-RET-may-split-line)
org_M_RET_may_split_line = true

# Whether a new heading (`heading`) and a new item (`plain_list_item`) get an
# empty line before them: `true`, `false`, or `"auto"`, as the headings or
# items around them have. (org-blank-before-new-entry)
# org_blank_before_new_entry = … (unset: `auto` for both)

# M-RET and M-S-RET outside lists put the new heading after the subtree, as
# C-RET does. (org-insert-heading-respect-content)
org_insert_heading_respect_content = false

# How C-a and C-e (`org.beginning.of.line`, `org.end.of.line`) move on a
# headline or an item: `true` to the start of the headline's title, after the
# stars, TODO keyword and priority, or after the item's bullet and check-box,
# and to the end of the title, before the tags; the same key again to the
# line's own start or end. `reversed` goes to the line's start or end first,
# and to those places on the same key right after. A pair, as `[true, false]`,
# sets C-a and C-e apart. With `false` the key keeps the editor's own meaning.
# (org-special-ctrl-a/e)
org_special_ctrl_a_e = false

# A sparse tree (`C-c /`, and a link's `/regexp/`) shows its matches in
# archived subtrees (tagged `ARCHIVE`); with `false` those subtrees stay
# folded under their headline. (org-sparse-tree-open-archived-trees)
org_sparse_tree_open_archived_trees = false

# Whether a sparse tree (`C-c /`, and a link's `/regexp/`) ignores case;
# `"smart"` ignores it unless what is searched for has an upper-case letter.
# (org-occur-case-fold-search)
org_occur_case_fold_search = true

# Highlight the matches of a sparse tree (`C-c /`, and a link's `/regexp/`)
# until the text changes; with `false`, only their lines show.
# (org-highlight-sparse-tree-matches)
org_highlight_sparse_tree_matches = true

# The highlights of a sparse tree (`C-c /` by a regexp, TODO keywords or
# dates, and a link's `/regexp/`) and the times of `C-c C-x C-d` go at the
# next change of the text; with `false` they stay until `C-c C-c`. Those of a
# sparse tree by tags or a property always stay, as in Emacs.
# (org-remove-highlights-with-change)
org_remove_highlights_with_change = true

# The timestamps the date sparse trees (`C-c /` `b`, `a`, `D`) look at first:
# `null` for scheduled and deadline dates, or one kind; `c` in the menu turns
# to the next kind. (org-sparse-tree-default-date-type)
# org_sparse_tree_default_date_type: null by default, which TOML has no word
# for

# C-y (`org.yank`, Emacs keys) of one or more subtrees at the start of a line,
# or after the stars of an otherwise empty headline, pastes them as
# `org.paste.subtree` does: at the level of the headlines around them.
# Anything else is the editor's own paste. (org-yank-adjusted-subtrees)
org_yank_adjusted_subtrees = false

# C-y (`org.yank`, Emacs keys) of one or more subtrees at the start of a line
# folds them, unless that would hide text after them (*Inserted text not
# folded because that would swallow text*), and leaves the cursor on the line
# after them. With `false` (and `org_yank_adjusted_subtrees` off) it is the
# editor's own paste. (org-yank-folded-subtrees)
org_yank_folded_subtrees = true

# Promoting a headline of level 1 makes it a comment line: `# ` in place of `*
# `, its children a level up with a subtree's promotion. With `false` it is an
# error. (org-allow-promoting-top-level-subtree)
org_allow_promoting_top_level_subtree = false

# Only odd levels: `*`, `***`, `*****`, each counted as the next level.
# Promoting and demoting go two stars at a time, and a headline is colored and
# matched (`LEVEL`) by the level it counts as. `#+STARTUP: odd` and `oddeven`
# set it for a file. (org-odd-levels-only)
org_odd_levels_only = false

# A headline of at least this many stars (twice as many less one with
# `org_odd_levels_only`) is an inline task: a task inside the text of its
# entry, closed by a line of as many stars and `END`. It is no part of the
# outline: it has no subtree, the outline and the motion between headings pass
# it, and it folds its text up to its `END` line. `false`: there are no inline
# tasks, as in Emacs before `org-inlinetask` is loaded.
# (org-inlinetask-min-level)
org_inlinetask_min_level = 15

# The stars of an inline task but the last two are hidden, as
# `org_hide_leading_stars` hides those of a headline; with `true` none are.
# (org-inlinetask-show-first-star)
org_inlinetask_show_first_star = false

# The TODO keyword of a new inline task (`org.inlinetask.insert`).
# (org-inlinetask-default-state)
# org_inlinetask_default_state = … (unset: no keyword)

# `org.open.line` (C-o) in a table inserts a row above; with `false` it opens
# a line there too. (org-special-ctrl-o)
org_special_ctrl_o = true

# C-k (`org.kill.line`) on a headline kills the text to the tags, and the tags
# when the cursor is past the title; at the start of the line, the whole line.
# With `false` the key keeps the editor's own meaning, but on a line a closed
# fold starts on (see `org_ctrl_k_protect_subtree`). (org-special-ctrl-k)
org_special_ctrl_k = false

# C-k (`org.kill.line`) on a line a closed fold starts on (a headline's only
# from its start with `org_special_ctrl_k`) kills what the fold hides with the
# line, as Emacs's `kill-line` does: `true` asks first (*Kill hidden subtree
# along with headline?*), `"error"` refuses (*‘C-k’ aborted as it would kill a
# hidden subtree*), `false` kills. Needs an editor that says which folds are
# closed (not VS Code). (org-ctrl-k-protect-subtree)
org_ctrl_k_protect_subtree = false

# Org's linter checks the documents and reports what it finds as diagnostics:
# misplaced headings and planning lines, links to nowhere, duplicate names,
# footnotes without definitions… What it finds is information, a hint for a
# checker Org trusts little: an Org file is text, nothing in it is an error or
# a warning. (org-lint)
org_lint = true

# The `org-lint` checkers to leave out, by name, as a diagnostic's code shows
# it (`"misplaced-heading"`). (org-lint)
org_lint_ignore = []

# The program that writes the man page of a `man:` link, when `ol-man` is in
# `org_modules`: the page is shown as text, at the line before the first match
# of what follows `::` (`man:ls::-l`). `"woman"`, Emacs's own reader, is `man`
# too. (org-man-command)
org_man_command = "man"

# The pages on the web of Info manuals: following an `info:` link to one of
# them, or to one of Emacs's manuals, opens its page at the node. Another
# manual is shown as text, as the `info` program writes the node.
# (org-info-other-documents)
org_info_other_documents = { dir = "https://www.gnu.org/manual/manual.html", libc = "https://www.gnu.org/software/libc/manual/html_mono/libc.html", make = "https://www.gnu.org/software/make/manual/make.html" }

# The `ctags` program (Exuberant or Universal Ctags) that `org.ctags.create`
# runs to make the `TAGS` file of a directory, when `org-ctags` is in
# `org_modules`. (org-ctags-path-to-ctags)
org_ctags_path_to_ctags = "ctags"

# With `org-ctags` in `org_modules`, what following a link to a headline, a
# target or a custom ID tries first, in turn, until one is done:
# `org-ctags-find-tag` (the tag of the `TAGS` file of the file's directory),
# `org-ctags-ask-rebuild-tags-file-then-find-tag` and
# `org-ctags-rebuild-tags-file-then-find-tag` (the `TAGS` file made again,
# then the tag), `org-ctags-ask-append-topic` and `org-ctags-append-topic` (a
# new topic at the end of the file), `org-ctags-ask-visit-buffer-or-file` and
# `org-ctags-visit-buffer-or-file` (the Org file of that name in the
# directory, made when asked), `org-ctags-fail-silently` (nothing more). When
# none is done, the link is followed as without them.
# (org-ctags-open-link-functions)
org_ctags_open_link_functions = ["org-ctags-find-tag", "org-ctags-ask-rebuild-tags-file-then-find-tag", "org-ctags-ask-append-topic"]

# The text of a new topic `org_ctags_open_link_functions` makes, `%t` the
# link's text capitalized. (org-ctags-new-topic-template)
org_ctags_new_topic_template = "* <<%t>>\n\n\n\n\n\n"

# Open a linked file that is not there with the application `org_file_apps`
# gives it, rather than saying `No such file`. The editor opens such a file
# either way. (org-open-non-existing-files)
org_open_non_existing_files = false

# Following a link to a directory opens the `index.org` in it, rather than the
# directory. (org-open-directory-means-index-dot-org)
org_open_directory_means_index_dot_org = false

# RET on the first line of a list item makes the next item, numbered as M-RET
# (`org-meta-return`) makes it (without a checkbox, which M-S-RET adds), the
# items after it renumbered, as nvim-orgmode's `org_return_uses_meta_return`
# does. Off, RET is Org's: a new line in the item. `org.return.item`
# (`<S-CR>`, Shift+Enter, with the vim keys) always does it.
return_uses_meta_return = false

# The deepest headings `org.goto` (`C-c C-j`) offers. (org-goto-max-level)
org_goto_max_level = 5

# With at least this many blank lines after a subtree, the last one stays
# outside its fold. Negative: all of them stay outside. `0`: none does.
# (org-cycle-separator-lines)
org_cycle_separator_lines = 2

# Whether list items fold, as subtrees do. `integrate` makes them part of the
# outline: TAB showing a headline's children folds its lists to their top
# items too. `false`: they do not fold. (org-cycle-include-plain-lists)
org_cycle_include_plain_lists = true

# The deepest headlines that fold; deeper ones are text of the subtree they
# are in. (org-cycle-max-level)
# org_cycle_max_level = … (unset: every level)

# TAB at the very start of the file, when its first line is no headline,
# cycles the whole file as S-TAB does. (org-cycle-global-at-bob)
org_cycle_global_at_bob = false

# TAB on a new, empty headline makes it a child of the headline before, then
# each level up, then a sibling again; on an empty item, it indents and
# outdents the item the same way. (org-cycle-level-after-item/entry-creation)
org_cycle_level_after_item_entry_creation = true

# Whether the images of `http:` and `https:` links show (`C-c C-x C-v`):
# `"skip"` not; `"download"` downloaded each time they show; `"cache"`
# downloaded once and kept for the session. The download follows
# `org_resource_download_policy`; an image larger than 20 MB is not
# downloaded. (org-display-remote-inline-images)
org_display_remote_inline_images = "skip"

# Which remote resources are downloaded (the images of links, and in Emacs a
# file attached from a URL, `C-c C-a u`, or a remote `#+INCLUDE:` or
# `#+SETUPFILE:` in an export): `true` all of them; `"prompt"` those
# considered safe, and the others when the answer to Emacs's question says so
# (in Emacs, a yes or no: yes downloads it this once); `"safe"` only those
# considered safe; `false` none but those. (org-resource-download-policy)
org_resource_download_policy = "prompt"

# The remote resources considered safe: Emacs regexps matched against a
# resource's URL and against the `file://` URL of the file asking for it. The
# answers `!`, `d` and `f` to the download question add one for the rest of
# the session. Emacs has them too, for what it downloads.
# (org-safe-remote-resources)
org_safe_remote_resources = []

# The deepest level `org-num-mode` numbers. (org-num-max-level)
# org_num_max_level = … (unset: every level)

# `org-num-mode` leaves `COMMENT` subtrees unnumbered.
# (org-num-skip-commented)
org_num_skip_commented = false

# `org-num-mode` leaves the footnotes section (`* Footnotes`) unnumbered.
# (org-num-skip-footnotes)
org_num_skip_footnotes = false

# `org-num-mode` leaves the subtrees of headlines with one of these tags
# (their own, not inherited) unnumbered. (org-num-skip-tags)
org_num_skip_tags = []

# `org-num-mode` leaves the subtrees of headlines with an `UNNUMBERED`
# property unnumbered. (org-num-skip-unnumbered)
org_num_skip_unnumbered = false

# The properties `org.custom.properties.toggle`
# (`org-toggle-custom-properties-visibility`) hides in the property drawers,
# and shows again: `["ID", "CUSTOM_ID"]`. Editors that can hide them: Neovim
# from 0.11, and Sublime Text, in a fold. (org-custom-properties)
org_custom_properties = []

# How many looks headlines take by level, from 1 to 8 (the token modifiers
# `level1` to `level8`, Org's `org-level-1` to `org-level-8`): with 4, a
# headline of level 5 looks as one of level 1, or as one of level 4 with
# `org_cycle_level_faces` off. (org-n-level-faces)
org_n_level_faces = 8

# Past the last look of `org_n_level_faces`, headlines take the looks of the
# levels from the first again; with `false`, those deeper all keep the last.
# (org-cycle-level-faces)
org_cycle_level_faces = true


# ----- Emacs and the server

# The Emacs program, for what only Org itself does: export
# (`org.export.dispatch`). The server starts it (`emacs --batch -Q`) when that
# is first asked for and keeps it running, so that Org loads once. Without
# Emacs, everything else works as before.
emacs = "emacs"

# A file of Emacs Lisp that Emacs loads before Org, for the variables export
# reads (`org-export-backends`, `org-html-…`, `org-latex-…`,
# `org-publish-project-alist`): a file of its own, or your init file. `~/` is
# the home directory.
# emacs_config_file = … (unset: none)

# Emacs Lisp that Emacs evaluates after `emacs_config_file` and before loading
# Org, for a few settings without a file that `emacs_options` cannot say: a
# function or a hook, or `(add-to-list 'load-path "~/src/org-mode/lisp")` for
# another Org. A yes-or-no question Emacs asks while it works
# (`org-confirm-babel-evaluate`) is asked in the editor.
# emacs_config = … (unset: none)

# Org's options for what Emacs does, by their names in Org, which Emacs sets
# as Customize does: `{ "org-attach-method": "mv", "org-export-with-toc":
# false }`. `true` is `t` and `false` `nil`, a list is a list and a table an
# association list; a string is a symbol where the option takes one, or a
# function, by its name. Each is set when Emacs loads the library it is in,
# after `emacs_config_file` and `emacs_config`, and so wins over them. A value
# the option does not take is left out, with a message naming the part that
# does not fit. The editor's go over the shared file's option by option. The
# options, each with Org's documentation of it, are in
# `docs/emacs-options.org`; the others are settings of the server, or Lisp
# (hooks, functions written out), which goes in `emacs_config`.
emacs_options = {}

# Save the files a command changes other than the one it was run in: an
# entry's file changed from the agenda, the target of a capture or of a
# refile. The editor saves them once it has made the change. Off, they are
# left with unsaved changes, as Emacs leaves them.
auto_save = true

# Let the assistants `org-lsp mcp` serves change files: its tools
# `set_todo_state`, `capture`, `refile`, `schedule`, `deadline`, `set_tags`,
# `set_property`, `delete_property`, `set_priority`, `set_effort`, `add_note`,
# `archive` and `delete_entry`, which write the agenda files, the capture
# targets, the files of `org_refile_targets` and the archive files directly.
# Off, it only reads. It is read from the shared configuration file, as
# everything `org-lsp mcp` reads.
mcp_edits = false
