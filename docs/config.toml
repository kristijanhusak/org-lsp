# `not_in_file`, `not_in_mode` or `not_in_buffer`, each with a regexp of the
# `regex` crate's syntax, matched ignoring case), and maybe `use`, the key of
# the template it stands for there. A template with contexts is offered only
# where one of their rules holds. The mode is `org-mode` in an Org file and
# `org-agenda-mode` in the agenda, where there is no file; the buffer's name
# is the file's. (org-capture-templates-contexts)
org_capture_templates_contexts = []

# Capture templates. Each has a `key`, a `description`, a `type` (`entry`, the
# default, `plain`, `item`, `checkitem` or `table-line`), a `target` and a
# `template` (text, or a list of lines), and may have `prepend`,
# `empty_lines`, `empty_lines_before`, `empty_lines_after`,
