org_edit_timestamp_down_means_later = false

# The step in which the minutes of a timestamp change (the second number of
# Org's option). (org-time-stamp-rounding-minutes)
org_time_stamp_rounding_minutes = 5

# A date typed without a year or month is the next one to come. With `time`, a
# time that has passed today is tomorrow's. (org-read-date-prefer-future)
org_read_date_prefer_future = true

# A typed year is kept within 1970 to 2037.
# (org-read-date-force-compatible-dates)
org_read_date_force_compatible_dates = true

# Show timestamps in `org_timestamp_custom_formats`: the date and time inside
# the brackets is hidden and the custom form shows in its place, as entities
# do. `#+STARTUP: customtime` turns it on for a file, and `C-c C-x C-t`
# (`org.timestamp.overlays.toggle`) on and off. Exports through Emacs use them
# too; the date prompt shows its answer in Org's own form.
# (org-display-custom-times)
org_display_custom_times = false

# The formats of `org_display_custom_times`, as `format-time-string` reads
# them (`%d.%m.%Y`); brackets around a format are dropped.
